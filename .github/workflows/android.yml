name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: braille-ocr

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using SDK at $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM unit tests
        run: ./gradlew :ocr-core:test :ocr-mlkit:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: braille-ocr-debug-apk
          path: braille-ocr/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            braille-ocr/*/build/reports/tests/
            braille-ocr/*/build/reports/lint-results-*.html
          if-no-files-found: ignore
